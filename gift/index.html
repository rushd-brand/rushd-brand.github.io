:root{--ink:#071039;--c2:#0F2270;--c3:#1A3BB0;--c4:#A3BCF9;--c5:#6B93F0;--bg:#EEF2FF;--mut:#4a5a8f;--line:#cdd8f5;--sa:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:TajM,Tajawal,sans-serif;font-size:18px;line-height:1.75;direction:rtl;padding-bottom:calc(86px + var(--sa))}
h1,h2,h3,b,.m,summary{font-family:TajB,Tajawal,sans-serif}h1{font-size:34px;margin:6px 0 14px;line-height:1.3}h2{font-size:34px;margin:0}h3{font-size:22px;margin:0 0 8px}p{margin:8px 0}
::selection{background:var(--c5);color:#fff}:focus-visible{outline:3px solid var(--c5);outline-offset:3px}::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:var(--c5);border-radius:9px}
.mut{color:var(--mut)}.m{font-weight:700}.w{max-width:1080px;margin:0 auto;padding:22px 18px}small{font-size:15px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;transition:box-shadow .3s,transform .3s;position:relative}
.card:hover{box-shadow:0 18px 40px #0F227022;background-image:radial-gradient(340px circle at var(--mx,50%) var(--my,50%),#6B93F022,transparent 70%)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));margin:16px 0}.grid.sm{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.sec{margin:30px 0 4px;font-size:24px}.hd{margin:8px 0 18px}.hd p{color:var(--mut);margin:4px 0}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:99px;padding:8px 22px;background:var(--c3);color:#fff;transition:.25s;text-decoration:none;display:inline-block;line-height:1.6}
button:hover,.btn:hover{filter:brightness(1.12);transform:translateY(-2px)}button:active{transform:scale(.96)}button.o{background:transparent;color:var(--c3);border:1.5px solid var(--line)}button:disabled{opacity:.5;pointer-events:none}
.fx{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;background:#fff;color:var(--ink);transition:.2s}.fx:focus{border-color:var(--c3);outline:0;box-shadow:0 0 0 4px #1A3BB022}textarea.fx{min-height:90px;resize:vertical}
label{display:block;font-family:TajB;margin:12px 0 4px;font-size:16px;color:var(--mut)}.fr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.fr .fx{flex:1;min-width:120px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tabs button{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.tabs button[aria-pressed=true]{background:var(--c3);color:#fff;border-color:var(--c3)}
.big{font-family:TajB;font-size:54px;line-height:1.2;color:var(--c3)}.big2{font-size:30px;color:var(--c3);margin-top:10px;min-height:44px}.empty{text-align:center;color:var(--mut)}
.hero{background:linear-gradient(135deg,var(--c2),var(--c3));color:#fff;border:0;margin-top:10px}.hero small{color:var(--c4)}.hero .mut{color:var(--c4)}
.xp,.pg{height:12px;border-radius:9px;background:var(--line);overflow:hidden;margin:10px 0}.hero .xp{background:#ffffff33}.xp i,.pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c5),var(--c4));transition:width .7s}.pg i{background:linear-gradient(90deg,var(--c3),var(--c5))}
.stat{text-align:center;padding:16px}.stat b{display:block;font-size:26px}.stat span{color:var(--mut);font-size:15px}
.tile{text-decoration:none;color:var(--ink);display:block}.tile b{display:block;font-size:24px}.tile span{color:var(--mut);font-size:16px}.tile:hover{transform:translateY(-5px)}
.quote{background:linear-gradient(135deg,#E6EDFD,#fff)}.q{font-family:TajB;font-size:24px;line-height:1.6}
.ck{display:flex;align-items:center;gap:10px;margin:8px 0;cursor:pointer}.ck input,.ti input{width:22px;height:22px;accent-color:var(--c3)}.dn{text-decoration:line-through;opacity:.5}
.ti{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.ti span{flex:1}.ti.d span{text-decoration:line-through;opacity:.5}.ti button{padding:0 12px}
details.card{padding:0}details summary{cursor:pointer;padding:18px 22px;font-size:20px;list-style:none;display:flex;justify-content:space-between}details summary:after{content:"＋";color:var(--c3)}details[open] summary:after{content:"－"}details>*:not(summary){margin-inline:22px}details>*:last-child{margin-bottom:22px}details ol{padding-inline-start:22px}
.hrw .hh{display:flex;flex-direction:column;margin-bottom:6px}.dots7{display:flex;gap:6px;margin:8px 0}.dots7 i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line)}.dots7 i.f{background:var(--c3);border-color:var(--c3)}
.cc{display:flex;flex-direction:column;gap:8px}.cc.done{border-color:var(--c5)}.tg{font-size:14px;background:#E6EDFD;color:var(--c3);padding:2px 12px;border-radius:99px;align-self:flex-start;font-family:TajB}
.les{cursor:pointer}.les.lock{opacity:.55}.les:hover{transform:translateY(-4px)}.act{background:#E6EDFD;margin:14px 0;border:0}
.rg{display:flex;align-items:center;gap:12px;margin:8px 0}.rg span{width:110px}.rg input{flex:1;accent-color:var(--c3)}.rg b{width:26px}
.prof{display:flex;align-items:center;gap:18px;margin-top:10px}.av{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--c3),var(--c5));color:#fff;display:grid;place-items:center;font-family:TajB;font-size:36px;flex:none}
.ach{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.ach span{padding:6px 16px;border-radius:99px;background:var(--line);color:var(--mut);filter:grayscale(1);opacity:.6;font-size:16px}.ach span.u{background:linear-gradient(135deg,var(--c3),var(--c5));color:#fff;filter:none;opacity:1;box-shadow:0 8px 20px #1A3BB055}
.hm{display:grid;grid-template-columns:repeat(7,minmax(0,34px));gap:6px;margin-top:12px}.hm i{height:34px;border-radius:6px;background:var(--line)}.hm i[data-h="1"]{background:var(--c4)}.hm i[data-h="2"]{background:var(--c5)}.hm i[data-h="3"]{background:var(--c3)}
.moods{display:flex;gap:8px}.mo{background:#fff;border:1.5px solid var(--line);font-size:26px;padding:2px 12px}.mo.on{background:var(--c4);border-color:var(--c3)}.jrow{padding:6px 0;border-bottom:1px solid var(--line);font-size:16px}
.chip{background:#fff;border:1.5px solid var(--line);padding:4px 12px;margin:0 0 6px 6px}.chip.on{background:var(--c4);border-color:var(--c3)}.bkr{margin:12px 0}

<script>
const LES=[
["ابدأ بالصغير","العادة الكبيرة بتتبني من خطوة صغيرة بتتكرر. لو مش قادر تكمّل، يبقى الخطوة كبيرة قوي.","صغّر عادة من عاداتك لحاجة تخلص في دقيقتين."],
["إشارة وفعل ومكافأة","كل عادة ليها محفّز بيبدأها، وفعل، ومكافأة بتخليك تكررها. لما تفهم التلاتة تقدر تغيّر أي عادة.","حدد محفّز واحد لعادة عايز تبنيها."],
["اربط عادتك بحاجة بتعملها","الجملة السحرية: بعد ما أعمل كذا هعمل كذا. زي: بعد ما أشرب قهوتي هكتب سطر في النوتة.","اكتب جملة «بعد ما ... هعمل ...» لعادتك."],
["غيّر مكانك قبل ما تغيّر نفسك","البيئة بتأثر فينا أكتر من الإرادة. حط الكتاب قدامك والموبايل بعيد.","شيل حاجة بتشتتك من قدامك دلوقتي."],
["هوية مش هدف","بدل «عايز أقرا ٢٠ كتاب» قول «أنا شخص بيقرا». كل مرة تعمل العادة بتصوّت لنفسك الجديدة.","اكتب جملة «أنا شخص...» تشبه اللي عايز تبقاه."],
["متفوّتش مرتين","لو فاتك يوم عادي جداً. المهم متفوّتش اليوم اللي بعده، لأن اليومين بيبقوا عادة جديدة.","لو فاتك يوم قريب، ارجع النهارده بنسخة صغيرة."],
["اللي بيتقاس بيتحسّن","علّم على كل يوم نفذت فيه عادتك. المتابعة نفسها بتحفّزك وبتوريك تقدمك.","علّم على عادة من عاداتك النهارده."],
["كافئ نفسك فوراً","المخ بيحب المكافأة السريعة. بعد العادة اتبسط بحاجة صغيرة عشان تتثبت.","اختار مكافأة صغيرة لعادتك."],
["الدافع بيروح والنظام بيفضل","مش هتكون متحمس كل يوم. الروتين والنظام هما اللي بيكمّلوا بيك.","اكتب روتين الصبح بتاعك في ٣ خطوات."],
["رتّب أولوياتك","اللي مهم وعاجل اعمله، اللي مهم ومش عاجل حدد له وقت، والباقي فوّضه أو شيله.","صنّف مهامك النهارده لأربع خانات."],
["كل الضفدعة الأول","ابدأ بأصعب مهمة وانت لسه صاحي ونشيط. باقي اليوم هيبقى أسهل.","اختار أصعب مهمة بكرة وحدد وقتها."],
["قاعدة التركيز ٢٥ دقيقة","٢٥ دقيقة تركيز و٥ راحة. المخ بيشتغل أحسن بفواصل منتظمة.","اعمل جلسة تركيز من تبويب الأدوات."],
["قول لأ","كل «أيوه» لحاجة مش مهمة هي «لأ» لحاجة مهمة. قولها بلطف وبوضوح.","اكتب حاجة هتقول لها لأ الأسبوع ده."],
["النوم أساس","النوم الكويس بيحسّن التركيز والمزاج والذاكرة أكتر من أي منبّه.","حدد معاد نوم ثابت هتلتزم بيه الأسبوع ده."],
["الحركة بتصحّي المخ","١٠ دقايق مشي بيفرقوا في المزاج والتركيز. مش لازم جيم.","امشي ١٠ دقايق النهارده."],
["اكتب اللي في دماغك","الأفكار اللي في دماغك بتاخد مساحة. لما تكتبها دماغك بتهدى وتشوف أوضح.","اكتب كل اللي شاغلك دلوقتي في سطور."],
["الامتنان","تلات حاجات كل يوم بتغيّر نظرتك على المدى الطويل. المخ بيدوّر على اللي بتركز عليه.","اكتب ٣ حاجات ممتن ليها."],
["اتكلم مع نفسك كويس","كلامك مع نفسك بيصنع مزاجك. اتكلم معاها زي ما بتكلم صاحبك.","غيّر جملة سلبية قلتها عن نفسك لجملة عادلة."],
["القلق بيقل بالخطة","اكتب اللي قلقان منه، وبعدين أقل خطوة ممكن تعملها. الفعل بيهدّي أكتر من التفكير.","اكتب قلقك وخطوة واحدة صغيرة."],
["اتعلم بالشرح","اشرح اللي اتعلمته لحد تاني أو اكتبه بكلامك، فهمك هيتثبت أكتر بكتير.","اشرح فكرة اتعلمتها النهارده في ٣ جمل."],
["قراية كل يوم","١٠ صفحات كل يوم تقريباً ١٢ كتاب في السنة. القراية الصغيرة المنتظمة بتكسب.","اقرا ١٠ صفحات النهارده."],
["ادفع لنفسك الأول","أول ما الفلوس توصلك، حوّش جزء صغير قبل أي صرف. الثبات أهم من المبلغ.","قرر مبلغ صغير هتحوشه كل أسبوع."],
["اعرف فلوسك رايحة فين","سجّل مصروفك أسبوع واحد بس، وهتتفاجئ. الوعي هو أول خطوة للتحكم.","سجّل مصروف النهارده من تبويب الأدوات."],
["الحدود الصحية","تحمي وقتك وطاقتك من غير ما تخسر حد. الاحترام بيبدأ منك.","اكتب حد واحد محتاج تحطه."],
["اسمع بجد","العلاقات بتتحسن لما تسمع من غير ما تجهّز ردك. السكوت أحياناً أحسن كلمة.","كلّم حد وسيب الموبايل وانت بتسمع."],
["اتعلم من الغلط","الغلط معلومة مش فضيحة. اسأل نفسك: إيه اللي اتعلمته؟ وإيه اللي هعمله المرة الجاية؟","اكتب غلطة قريبة واتعلمت منها إيه."],
["ركّز على اللي في إيدك","فيه حاجات تقدر تتحكم فيها وحاجات لأ. طاقتك تروح للأولى بس.","قسّم همّك لـ«في إيدي» و«مش في إيدي»."],
["الراحة مش كسل","الراحة بتمنع الاحتراق وبتخليك تكمّل أطول. من غير راحة الإنتاجية بتقع.","حدد وقت راحة من غير موبايل النهارده."],
["راجع أسبوعك","كل أسبوع اسأل: إيه اللي نجح؟ إيه اللي هغيّره؟ المراجعة بتخلّيك تتحسن بدل ما تكرر.","اكتب نجاح واحد وتعديل واحد للأسبوع الجاي."],
